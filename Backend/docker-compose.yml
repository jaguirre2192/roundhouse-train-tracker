services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: traintracker
      POSTGRES_USER: traintracker
      POSTGRES_PASSWORD: traintracker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traintracker"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - train-tracker-postgres:/var/lib/postgresql/data

volumes:
  train-tracker-postgres:
